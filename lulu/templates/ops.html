<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lulu · 商品成品</title>
<style>
:root{--ink:#263930;--muted:#6f7f75;--paper:#f4f3ed;--accent:#b9d79b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}header{padding:38px max(24px,5vw);background:#20372d;color:#fff}header span{color:var(--accent);letter-spacing:3px;font-size:12px}h1{font-size:32px;margin:8px 0}header p{color:#becac2;margin:0}main{padding:28px max(24px,5vw)}.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:25px}.stat{min-width:150px;padding:16px 22px;background:#fff;border-radius:12px}.stat b{font-size:27px;display:block}.stat small{color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,button{border:1px solid #cdd4c9;border-radius:8px;padding:10px 14px;background:#fff;color:var(--ink);font:inherit}button{cursor:pointer}button:hover{background:#e1ead9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #20372d08;cursor:pointer}.photo{height:220px;background:#ebece5;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.card section{padding:18px}.card h3{font-size:15px;font-weight:600;line-height:1.6;margin:8px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:70px}.badge{font-size:11px;padding:4px 8px;border-radius:6px;background:#eceee8;display:inline-block}.ready{background:#dfefd1}.hold{background:#fff0ce}.meta{font-size:12px;color:var(--muted)}.empty{padding:60px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:15px;max-width:1050px;width:94vw;max-height:90vh;padding:28px;color:var(--ink)}dialog::backdrop{background:#16251bb3}.close{float:right}.gallery{display:flex;gap:12px;overflow:auto;margin:20px 0}.gallery img{height:260px;max-width:300px;object-fit:contain;background:#f6f6f0;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #dde1d7;text-align:left;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.notice{padding:14px;background:#fff3d8;border-radius:8px;font-size:13px}.detail-copy{line-height:1.8}.detail-copy h2{font-size:18px}.footer{margin:25px 0;text-align:center}#error{color:#9e4a33}.token{margin-left:auto;max-width:220px}a{color:var(--ink)}
</style></head><body>
<header><span>LULU · INTERNAL COLLECTION</span><h1>亚洲商品，整理成你看得懂的好物。</h1><p>天猫国际 · 简体中文成品 · 加拿大市场准备</p></header>
<main><div class="stats" id="stats"></div><div class="notice">内部审核空间：采购价与库存保留来源观察时间；CAD 售价、履约与可购买资格尚未配置。源图参考不等于审核通过的成品媒体。</div>
<div class="filters"><input id="q" placeholder="搜索品牌或商品名称"><select id="category"><option value="">所有品类</option><option value="food">食品</option><option value="supplements">保健品</option><option value="beauty">美妆个护</option><option value="mother_baby">母婴</option></select><select id="status"><option value="">所有状态</option><option value="CONTENT_READY">成品完成</option><option value="NEEDS_EVIDENCE">待补证</option><option value="EXCLUDED">已排除</option><option value="PENDING">待处理</option></select><select id="scope"><option value="INCLUDED">符合范围</option><option value="SCOPE_REVIEW">范围待确认</option><option value="OUT_OF_SCOPE">范围外</option></select><button id="search">查看</button><input class="token" id="token" type="password" placeholder="访问令牌（如已启用）"></div>
<p id="error"></p><div class="grid" id="grid"></div><div class="footer"><button id="more" hidden>加载更多</button></div></main>
<dialog id="detail"><button class="close" id="close">关闭</button><div id="detailBody"></div></dialog>
<script>
const $=s=>document.querySelector(s),names={CONTENT_READY:'成品完成',NEEDS_EVIDENCE:'待补证',EXCLUDED:'已排除',PENDING:'待处理'},cats={food:'食品',supplements:'保健品',beauty:'美妆个护',mother_baby:'母婴'};let cursor=null;
$('#status').value='CONTENT_READY';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const token=$('#token').value;const r=await fetch(path,{headers:token?{Authorization:'Bearer '+token}:{}});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(reset=true){try{$('#error').textContent='';if(reset){cursor=null;$('#grid').replaceChildren()}let p=new URLSearchParams({limit:'24',scope:$('#scope').value});for(let k of ['q','category','status'])if($('#'+k).value)p.set(k,$('#'+k).value);if(cursor)p.set('after',cursor);const d=await api('/v1/products?'+p);cursor=d.after;$('#more').hidden=!cursor;for(let r of d.items){let a=document.createElement('article');a.className='card';let image=r.media[0]?.url||r.reference_image;let cls=r.status==='CONTENT_READY'?'ready':'hold';a.innerHTML='<div class="photo">'+(image?'<img loading="lazy" src="'+esc(image)+'" alt="">':'<span>媒体待补证</span>')+'</div><section><span class="badge '+cls+'">'+esc(names[r.status]||r.status)+'</span><h3>'+esc(r.title)+'</h3><p class="meta">'+esc(r.brand)+' · '+esc(cats[r.category]||'分类待确认')+'</p><p class="meta">来源 '+r.source_sku_count+' SKU · 成品 '+r.content_sku_count+' SKU</p><p class="meta">'+(r.media.length?'已复用合格媒体':'源图参考／待审核')+'</p></section>';a.onclick=()=>detail(r.product_id);$('#grid').append(a)}if(!$('#grid').children.length)$('#grid').innerHTML='<div class="empty">暂无符合条件的商品。</div>'}catch(e){$('#error').textContent=e.message}}
async function detail(pid){try{const row=await api('/v1/products/'+pid),f=row.facts,r=row.result||{},c=r.content||{};let body='<h2>'+esc(c.title||f.title)+'</h2><p>'+esc(names[row.status]||row.status)+' · '+esc(f.brand)+' · '+esc(cats[f.category]||'范围待确认')+'</p><p class="meta">来源商品 '+esc(pid)+' · 观察时间 '+esc(f.observed_at||'缺失')+'</p><div class="gallery">';for(let m of r.media||[])body+='<img src="'+esc(m.url)+'" alt="'+esc(m.alt)+'">';body+='</div>';if(c.description_html)body+='<div class="detail-copy">'+c.description_html+'</div>';else body+='<div class="notice">尚未形成合格成品，下方仅为来源规格和缺口参考。</div>';body+='<h3>来源 SKU 与处理状态</h3><table><tr><th>规格</th><th>来源 ID</th><th>处理</th><th>历史采购价 CNY</th></tr>';for(let s of f.source_skus||[]){let kept=(r.content_skus||[]).find(x=>x.source_sku_id===s.source_sku_id),held=(r.withheld_skus||[]).find(x=>x.source_sku_id===s.source_sku_id);body+='<tr><td>'+esc(kept?.consumer_label||held?.label||s.raw_label)+'</td><td>'+esc(s.source_sku_id)+'</td><td>'+esc(kept?'成品保留':(held?.reasons||['待核验']).join(' / '))+'</td><td>'+esc(s.source_price_cny||'缺失')+'</td></tr>'}body+='</table>';body+='<h3>缺项与发布预检</h3><pre>'+esc(JSON.stringify({issues:r.issues||f.scope_reasons,publication:r.preflight?.blockers},null,2))+'</pre>';$('#detailBody').innerHTML=body;$('#detail').showModal()}catch(e){$('#error').textContent=e.message}}
async function stats(){try{let d=await api('/v1/audit'),included=d.audit.scope_counts.INCLUDED||0,review=d.audit.scope_counts.SCOPE_REVIEW||0,ready=d.counts.filter(x=>x.status==='CONTENT_READY').reduce((n,x)=>n+x.n,0),hold=d.counts.filter(x=>x.scope_status==='INCLUDED'&&x.status==='NEEDS_EVIDENCE').reduce((n,x)=>n+x.n,0);$('#stats').innerHTML=[[included,'范围内来源商品'],[ready,'简中成品完成'],[hold,'范围内待补证'],[review,'范围待确认']].map(([n,t])=>'<div class="stat"><b>'+n+'</b><small>'+t+'</small></div>').join('')}catch(e){$('#error').textContent=e.message}}
$('#search').onclick=()=>{stats();load()};$('#more').onclick=()=>load(false);$('#close').onclick=()=>$('#detail').close();$('#q').onkeydown=e=>{if(e.key==='Enter')load()};stats();load();
</script></body></html>
